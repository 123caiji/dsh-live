name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev deps (jsdom/react for the render test)
        run: npm install --no-audit --no-fund
      - name: Unit tests (host fold + client module + component render)
        run: npm test
      - name: Real React 19 + jsdom mount test
        run: npm run test:react
